#
# /etc/rawclip/rawclip.conf: rawclip clipboard history policy
#

history = {
    max_entries = 256;
    max_entry_bytes = 131072;
    deduplicate = true;
};

selection = {
    clipboard = true;
    primary = false;
};

security = {
    # Refuse selections advertising x-kde-passwordManagerHint=secret before
    # requesting their text payload.
    honor_password_manager_hint = true;
};

menu = {
    command = "rawmenu";
    prompt = "clipboard";
};

# Rules match every field present in the group. They are a secondary policy
# for applications which do not publish the password-manager hint.
exclude = ();
